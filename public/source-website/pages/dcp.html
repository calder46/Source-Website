
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FastTrak | Completion Plan</title>

  <script>
    const currentTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', currentTheme);
  </script>

  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<header class="top-nav">
  <div class="logo">FastTrak</div>
  <nav class="nav-links">
    <a href="../index.html">Home</a>
    <a href="search.html">Course Search</a>
    <a href="calendar.html">Calendar</a>
    <a href="dcp.html" class="active">Completion Plan</a>

    <div class="theme-switch-wrapper">
      <label class="theme-switch" for="checkbox">
        <input type="checkbox" id="checkbox">
        <span class="slider"></span>
      </label>
    </div>
  </nav>
</header>

<div class="app-layout">
  <aside class="sidebar" id="main-sidebar">
    <div class="sidebar-content">
      <h3>Enrolled Classes</h3>
      <div id="enrolled-list"></div>
      <button id="unenroll-all-btn" class="btn btn-danger" style="margin-top: auto; font-size: 0.8rem; align-self: stretch;">Unenroll All</button>
    </div>
  </aside>

  <button id="sidebar-toggle-floating" title="Toggle Sidebar"></button>

  <main id="dashboard" class="dashboard-grid">
    <h1 style="grid-column: 1 / -1;">Degree Completion Planner</h1>

    <div id="widget-requisites" class="widget">Requisites Flow</div>
    <div id="widget-optimizer" class="widget">Optimizer</div>

    <!-- Example Widget for testing -->
    <div class="widget">
      <h3>Goal: Graduation</h3>
      <p>Progress: 45%</p>
      <div style="width: 100%; background: #eee; height: 10px; border-radius: 5px;">
        <div style="width: 45%; background: var(--accent); height: 100%;"></div>
      </div>
    </div>
  </main>
</div>

<script src="../js/courses.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
