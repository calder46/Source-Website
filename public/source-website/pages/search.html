
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FastTrak | Course Search</title>

  <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';</script>

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/degree-plan.css">
</head>
<body class="degree-page">
<header class="plan-topbar"><a class="plan-brand" href="../index.html">FastTrak <span>Course Registration</span></a></header>
<nav class="plan-nav" aria-label="Main navigation"><a href="../index.html">⌂ Home</a><a href="search.html" aria-current="page">⌕ Course Search</a><a href="calendar.html">▦ Course Calendar</a><a href="dcp.html">▣ Degree Completion Plan</a><a href="optimizer.html">⚙ Course Optimizer</a><div class="plan-nav-end"><label class="theme-switch" for="checkbox"><input type="checkbox" id="checkbox" aria-label="Dark theme"><span class="slider"></span></label></div></nav>
<section class="student-band"><div class="student-summary"><div><p class="eyebrow">COURSE REGISTRATION</p><h1 class="band-title">Course Search</h1></div></div></section>

<div class="app-layout">
  <aside class="sidebar" id="main-sidebar">
    <div class="sidebar-content">
      <h3>Enrolled Classes</h3>
      <div id="enrolled-list"></div>
      <button id="unenroll-all-btn" class="btn btn-danger" style="margin-top: auto; font-size: 0.8rem; align-self: stretch;">Unenroll All</button>
    </div>
  </aside>

  <button id="sidebar-toggle-floating" title="Toggle Sidebar"></button>

  <main>
    
    <div class="search-container" style="margin-bottom: 30px;">
      <label for="course-search" class="visually-hidden">Search courses</label>
      <input type="text" id="course-search" placeholder="Type a course name or code (e.g., CS101)...">
      <button id="toggle-prereqs-btn" class="text-action" type="button">Don't display prerequisites</button>
    </div>

    <!-- This container will be filled by JavaScript -->
    <div id="course-results" class="course-results">
      <!-- Search results appear here -->
    </div>
  </main>
</div>

<script src="../js/courses.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
