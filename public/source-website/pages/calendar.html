
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FastTrak | Calendar</title>

  <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';</script>

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/degree-plan.css">
</head>
<body class="degree-page">
<header class="plan-topbar"><a class="plan-brand" href="../index.html">FastTrak <span>Course Registration</span></a></header>
<nav class="plan-nav" aria-label="Main navigation"><a href="../index.html">⌂ Home</a><a href="search.html">⌕ Course Search</a><a href="calendar.html" aria-current="page">▦ Course Calendar</a><a href="dcp.html">▣ Degree Completion Plan</a><a href="optimizer.html">⚙ Course Optimizer</a><div class="plan-nav-end"><label class="theme-switch" for="checkbox"><input type="checkbox" id="checkbox" aria-label="Dark theme"><span class="slider"></span></label></div></nav>
<section class="student-band"><div class="student-summary"><div><p class="eyebrow">COURSE REGISTRATION</p><h1 class="band-title">Course Calendar</h1></div></div></section>

<div class="app-layout">
  <aside class="sidebar" id="main-sidebar">
    <div class="sidebar-content">
      <h3>Enrolled Classes</h3>
      <div id="enrolled-list"></div>
      <button id="unenroll-all-btn" class="btn btn-danger" style="margin-top: auto; font-size: 0.8rem; align-self: stretch;">Unenroll All</button>
    </div>
  </aside>

  <button id="sidebar-toggle-floating" title="Toggle Sidebar"></button>

  <main>
    
    <div id="calendar-container" class="requirement-group calendar-panel">
      <table class="schedule-grid">
        <thead>
        <tr>
          <th>Time</th>
          <th>Mon</th>
          <th>Tue</th>
          <th>Wed</th>
          <th>Thu</th>
          <th>Fri</th>
        </tr>
        </thead>
        <tbody id="calendar-body">
        <!-- Rows for hours will be generated by JS -->
        </tbody>
      </table>
    </div>
  </main>


</div>

<script src="../js/courses.js"></script>
<script src="../js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const tbody = document.getElementById('calendar-body');
    const enrolled = JSON.parse(localStorage.getItem('enrolled_courses') || '[]');

    // 1. Generate Time Rows (8 AM to 7 PM)
    for (let hour = 8; hour <= 19; hour++) {
      const row = document.createElement('tr');
      row.id = `hour-row-${hour}`;
      // Display time in standard format
      const displayHour = hour > 12 ? `${hour - 12} PM` : hour === 12 ? '12 PM' : `${hour} AM`;

      row.innerHTML = `<td class="time-col">${displayHour}</td>` +
              Array(5).fill('').map(() => `<td></td>`).join('');
      tbody.appendChild(row);
    }

    // 2. Place Classes in the Grid
    enrolled.forEach(course => {
      if (!course.day || !course.startTime || !course.endTime) return;

      const dayMap = { "M": 1, "T": 2, "W": 3, "H": 4, "F": 5 };
      // Split days in case it's a multi-day course (e.g., "M, W")
      const days = course.day.split(',').map(d => d.trim());

      const startMinutes = parseInt(course.startTime.replace(':', '')) || 0;

      const startHour = parseInt(course.startTime.split(':')[0]);

      days.forEach(day => {
        const colIndex = dayMap[day];
        if (colIndex && !isNaN(startHour)) {
          const targetRow = document.getElementById(`hour-row-${startHour}`);
          if (targetRow) {
            const cell = targetRow.children[colIndex];
            const block = document.createElement('div');
            block.className = 'course-block';
            // Show the formatted time on the block
            block.innerHTML = `<strong title="${course.name}">${course.id}</strong><br>${formatTime(course.startTime) + " - " + formatTime(course.endTime) }`;
            cell.appendChild(block);
          }
        }
      });
    });
  });
</script>
</body>
</html>
